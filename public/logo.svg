<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Polygon -->
  <polygon points="50,6 90,26 90,68 50,94 10,68 10,26" fill="#141418" stroke="url(#shieldGrad)" stroke-width="4" />
  <!-- Abstract Pulse / Chaos Fault Line -->
  <path d="M 22 50 L 38 50 L 46 28 L 54 72 L 62 42 L 70 50 L 78 50" stroke="#E50914" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <!-- Core Recovery Spark -->
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
</svg>
