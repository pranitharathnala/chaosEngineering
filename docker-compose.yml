# ==============================================================================
# ChaosResilience - Docker Compose Orchestration (Task 4)
# Production topology with real Docker HEALTHCHECK and automatic restart:
# - backend: Python Flask API with live /health healthcheck and restart policy
# - frontend: React production build served via Nginx on port 80 (mapped to 3000 & 80)
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chaos-backend
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').getcode() == 200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=
    container_name: chaos-frontend
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: always

networks:
  default:
    name: chaos-network
